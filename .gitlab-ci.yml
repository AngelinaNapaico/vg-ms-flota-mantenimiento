# Continuous Integration Pipeline - VG Fleet Maintenance Microservice

image: maven:3.9.6-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Djava.awt.headless=true"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  paths:
    - .m2/repository

stages:
  - build
  - test
  - quality
  - notify

# ==============================================================================
# STAGE 1: Compile
# ==============================================================================
build:
  stage: build
  script:
    - echo "Compiling fleet maintenance microservice..."
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - target/classes
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/

# ==============================================================================
# STAGE 2: Unit & Integration Tests (JUnit + JaCoCo)
# ==============================================================================
unit-tests:
  stage: test
  needs:
    - build
  script:
    - echo "Executing unit and integration test suite..."
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/classes/
      - target/test-classes/
      - target/surefire-reports/
      - target/site/jacoco/
      - target/jacoco.exec
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/

standards-check:
  stage: test
  image: python:3.12-slim
  allow_failure: true
  script:
    - mkdir -p reporte-estandares
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git clone -q --depth 1 https://gitlab.com/vallegrande/prs241/standards-checker.git /tmp/sc || true
    - |
      if [ -d "/tmp/sc" ] && [ -n "$STANDARDS_WEBHOOK_URL" ]; then
        pip install -q -r /tmp/sc/requirements.txt
        python /tmp/sc/run.py --micro "$CI_PROJECT_DIR" --nombre "$CI_PROJECT_NAME" --rama "$CI_COMMIT_REF_NAME" --commit "$CI_COMMIT_SHORT_SHA" --out reporte-estandares --publicar "webhook:$STANDARDS_WEBHOOK_URL"
      else
        echo "Skipping external standards-checker webhook (repository unavailable or STANDARDS_WEBHOOK_URL not configured)."
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reporte-estandares/
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# ==============================================================================
# STAGE 3: Coverage Report & SonarCloud Quality Analysis
# ==============================================================================
jacoco-report:
  stage: quality
  needs:
    - unit-tests
  script:
    - echo "Publishing JaCoCo coverage report..."
    - |
      if [ ! -f target/site/jacoco/jacoco.xml ]; then
        mvn $MAVEN_CLI_OPTS jacoco:report
      fi
    - |
      if [ -f target/site/jacoco/jacoco.csv ]; then
        awk -F"," '{ instructions += $4 + $5; covered += $5 } END { if (instructions > 0) printf "Total coverage: %.0f%%\n", 100*covered/instructions }' target/site/jacoco/jacoco.csv
      fi
  artifacts:
    paths:
      - target/site/jacoco/
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/

sonarcloud-check:
  stage: quality
  image: maven:3-eclipse-temurin-21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  needs:
    - unit-tests
  script:
    - |
      if [ -z "$SONAR_TOKEN" ]; then
        echo "SONAR_TOKEN is not configured in GitLab CI/CD Variables. Skipping SonarCloud analysis."
        exit 0
      fi
      mvn $MAVEN_CLI_OPTS org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
        -Dsonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.organization="${SONAR_ORGANIZATION:-vallegrande}" \
        -Dsonar.projectKey="${SONAR_PROJECT_KEY:-vg-ms-fleet-maintenance}" \
        -Dsonar.projectName="VG Microservicio Flota Mantenimiento" \
        -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml" \
        -Dsonar.qualitygate.wait=false
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/

# ==============================================================================
# STAGE 4: Slack Pipeline Notifications
# ==============================================================================
notify-slack-success:
  stage: notify
  image: curlimages/curl:latest
  allow_failure: true
  script:
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification."
        exit 0
      fi

      COMMIT_TITLE=$(echo "$CI_COMMIT_TITLE" | sed 's/"/\\"/g')

      PAYLOAD=$(cat <<EOF
      {
        "attachments": [
          {
            "color": "#2eb886",
            "title": "[Pipeline Succeeded] - vg-ms-fleet-maintenance",
            "title_link": "$CI_PIPELINE_URL",
            "text": "CI/CD pipeline completed successfully with unit, integration and quality checks.",
            "fields": [
              { "title": "Branch", "value": "$CI_COMMIT_REF_NAME", "short": true },
              { "title": "Commit", "value": "$CI_COMMIT_SHORT_SHA ($COMMIT_TITLE)", "short": true },
              { "title": "Author", "value": "$GITLAB_USER_NAME", "short": true },
              { "title": "Pipeline ID", "value": "#$CI_PIPELINE_ID", "short": true },
              { "title": "SonarCloud", "value": "<https://sonarcloud.io/project/overview?id=vg-ms-fleet-maintenance|View SonarCloud Dashboard>", "short": true },
              { "title": "Test Report", "value": "<$CI_PIPELINE_URL/test_report|View JUnit Tests in GitLab>", "short": true }
            ],
            "footer": "Canete Seguro PRS - GitLab CI/CD",
            "ts": $(date +%s)
          }
        ]
      }
      EOF
      )

      RESPONSE=$(curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL")
      echo "Slack Webhook response: $RESPONSE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/
      when: on_success

notify-slack-failure:
  stage: notify
  image: curlimages/curl:latest
  allow_failure: true
  script:
    - |
      if [ -z "$SLACK_WEBHOOK_URL" ]; then
        echo "SLACK_WEBHOOK_URL is not configured. Skipping Slack notification."
        exit 0
      fi

      COMMIT_TITLE=$(echo "$CI_COMMIT_TITLE" | sed 's/"/\\"/g')

      PAYLOAD=$(cat <<EOF
      {
        "attachments": [
          {
            "color": "#e01e5a",
            "title": "[Pipeline Failed] - vg-ms-fleet-maintenance",
            "title_link": "$CI_PIPELINE_URL",
            "text": "Errors occurred during CI/CD pipeline execution.",
            "fields": [
              { "title": "Branch", "value": "$CI_COMMIT_REF_NAME", "short": true },
              { "title": "Commit", "value": "$CI_COMMIT_SHORT_SHA ($COMMIT_TITLE)", "short": true },
              { "title": "Author", "value": "$GITLAB_USER_NAME", "short": true },
              { "title": "Pipeline ID", "value": "#$CI_PIPELINE_ID", "short": true },
              { "title": "SonarCloud", "value": "<https://sonarcloud.io/project/overview?id=vg-ms-fleet-maintenance|View SonarCloud Dashboard>", "short": true },
              { "title": "Details", "value": "<$CI_PIPELINE_URL|View Pipeline Logs>", "short": true }
            ],
            "footer": "Canete Seguro PRS - GitLab CI/CD",
            "ts": $(date +%s)
          }
        ]
      }
      EOF
      )

      RESPONSE=$(curl -sS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL")
      echo "Slack Webhook response: $RESPONSE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\/.*/
      when: on_failure
