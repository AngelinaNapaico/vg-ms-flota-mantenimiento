# Pipeline de Integración Continua - VG Microservicio de Flota y Mantenimiento
# Arquitectura Hexagonal y Verificación de Estándares PR241

image: maven:3.9.6-eclipse-temurin-17

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository

stages:
  - build
  - test
  - quality

build:
  stage: build
  script:
    - echo "🔨 Compilando el proyecto..."
    - mvn clean compile
  artifacts:
    paths:
      - target/classes
    expire_in: 1 hour

test:
  stage: test
  script:
    - echo "🧪 Ejecutando pruebas unitarias y parametrizadas..."
    - mvn test
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/jacoco.exec
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    expire_in: 7 days

jacoco-report:
  stage: quality
  script:
    - echo "📊 Generando reporte de cobertura con JaCoCo..."
    - mvn jacoco:report
  dependencies:
    - test
  artifacts:
    paths:
      - target/site/jacoco/
    expire_in: 7 days
  coverage: '/Total.*?([0-9]{1,3})%/'

# Job obligatorio según PRS241_standards (ProjectArchitecture)
standards-check:
  stage: test
  image: python:3.12-slim
  allow_failure: true
  variables:
    STANDARDS_WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID/exec"
  script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - git clone -q --depth 1 https://gitlab.com/vallegrande/prs241/standards-checker.git /tmp/sc || true
    - |
      if [ -d "/tmp/sc" ]; then
        pip install -q -r /tmp/sc/requirements.txt
        python /tmp/sc/run.py --micro "$CI_PROJECT_DIR" --nombre "$CI_PROJECT_NAME" --rama "$CI_COMMIT_REF_NAME" --commit "$CI_COMMIT_SHORT_SHA" --out reporte-estandares --publicar "webhook:$STANDARDS_WEBHOOK_URL"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reporte-estandares/
  only:
    - develop
