upstream vg_ms_fleetmaintenance {
    server vg-ms-fleetmaintenance:9012;
}

limit_req_zone $binary_remote_addr zone=fleet_api_limit:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Public business routes require Bearer JWT authentication forwarded to the resource server
    location /api/v1/maintenance-orders {
        limit_req zone=fleet_api_limit burst=20 nodelay;

        if ($http_authorization !~* "^Bearer .+") {
            return 401;
        }

        proxy_pass http://vg_ms_fleetmaintenance;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 20s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # Block internal inter-service endpoints from external ingress
    location /internal/ {
        return 403;
    }

    # Block actuator introspection and management endpoints from external ingress
    location /actuator/ {
        return 403;
    }

    # Block OpenAPI and Swagger UI documentation endpoints from external ingress
    location /swagger-ui {
        return 403;
    }

    location /v3/api-docs {
        return 403;
    }

    location /webjars {
        return 403;
    }

    # Gateway edge health probe without exposing internal microservice endpoints
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Default deny policy for any undeclared path
    location / {
        return 403;
    }
}
