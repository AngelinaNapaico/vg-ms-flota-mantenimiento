# Configuración para entorno de Producción (prod)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

logging:
  level:
    root: WARN
    pe.edu.vallegrande.vgmsfleetmaintenance: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
