# Configuración para entorno de Producción (prod)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    pe.edu.vallegrande.vgmsfleetmaintenance: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
