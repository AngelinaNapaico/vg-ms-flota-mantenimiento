# Configuración para entorno de Producción (prod)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://iam.vallegrande.edu.pe/realms/PRS}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:https://iam.vallegrande.edu.pe/realms/PRS/protocol/openid-connect/certs}

logging:
  level:
    root: WARN
    pe.edu.vallegrande.vgmsfleetmaintenance: INFO

management:
  endpoint:
    health:
      show-details: when-authorized
