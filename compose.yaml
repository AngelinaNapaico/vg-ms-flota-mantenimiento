services:
  vg-api-gateway:
    image: nginx:alpine
    container_name: vg-api-gateway
    ports:
      - "9000:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vg-ms-fleetmaintenance
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    networks:
      - vg-gateway-net
      - vg-internal-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vg-keycloak
    profiles:
      - dev
    command: start --optimized
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - vg-internal-net

  vg-ms-fleetmaintenance:
    build: .
    image: valencia123/vg-ms-fleet-maintenance:5.7
    container_name: vg-ms-fleetmaintenance
    environment:
      JAVA_TOOL_OPTIONS: "-Dreactor.netty.ioWorkerCount=4 -Dreactor.netty.ioSelectCount=1 -Xms64m -Xmx128m -Xss256k -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=32m -XX:TieredStopAtLevel=1 -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
      SERVER_PORT: 9012
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      MONGO_FLEET_DATABASE: ${MONGO_FLEET_DATABASE:-db_fleet}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      SERVICES_RECURSOS_URL: http://vg-ms-recursos:9004
      SERVICES_CATALOGO_URL: http://vg-ms-catalogos:9005
      SERVICES_INCIDENTES_URL: http://vg-ms-incidentes:9003
    # Internal-only port on isolated vg-internal-net; never published directly to host.
    # All external traffic enters exclusively via vg-api-gateway (config/nginx.conf).
    expose:
      - "9012"
    mem_limit: 250m
    memswap_limit: 250m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - vg-internal-net
      - vg-egress-net

networks:
  vg-gateway-net:
    name: vg-gateway-net
    driver: bridge
  vg-internal-net:
    name: vg-internal-net
    driver: bridge
    internal: true
  vg-egress-net:
    name: vg-egress-net
    driver: bridge
