services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vg-keycloak
    profiles:
      - dev
    command: start --optimized
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:CHANGE_ME_KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:CHANGE_ME_KEYCLOAK_PASSWORD}
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - vg-network

  vg-ms-fleetmaintenance:
    build: .
    image: carlosguerrero11/vg-ms-fleet-maintenance:1.0
    container_name: vg-ms-fleetmaintenance
    environment:
      SERVER_PORT: 9012
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      MONGO_FLEET_DATABASE: ${MONGO_FLEET_DATABASE:-db_fleet}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      SERVICES_RECURSOS_URL: http://vg-ms-recursos:9004
      SERVICES_CATALOGO_URL: http://vg-ms-catalogos:9005
      SERVICES_INCIDENTES_URL: http://vg-ms-incidentes:9003
    # Puerto expuesto internamente en vg-network, sin mapeo directo de host.
    # El trafico externo se rutea exclusivamente a traves de vg-ms-api-gateway.
    expose:
      - "9012"
    mem_limit: 300m
    restart: unless-stopped
    networks:
      - vg-network

networks:
  vg-network:
    name: vg-network
    driver: bridge
